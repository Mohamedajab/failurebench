[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failurebench"
version = "0.1.0"
description = "A reproducible audit of prediction intervals under input-dependent feature loss"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.3", "scipy==1.16.2", "scikit-learn==1.7.2", "matplotlib==3.10.6", "xlrd==2.0.2", "openpyxl==3.1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["failurebench*"]
